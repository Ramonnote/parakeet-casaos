name: Build Parakeet ASR (CPU/arm64) e publicar no ghcr

on:
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Clonar o projeto do Pablo Bispo
        uses: actions/checkout@v4
        with:
          repository: PabloBispo/parakeet-local-asr
          ref: master

      - name: Configurar QEMU (para construir ARM64 em runner x86)
        uses: docker/setup-qemu-action@v3

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem ASR (CPU, arm64)
        uses: docker/build-push-action@v6
        with:
          context: ./approach-a
          file: ./approach-a/Dockerfile.cpu
          platforms: linux/arm64
          push: true
          tags: ghcr.io/ramonnote/parakeet-asr:cpu

name: Build e publicar imagem do webapp (ARM64)

# Constrói a imagem do webapp para ARM64 (VPS Oracle Ampere) e publica
# no GitHub Container Registry (ghcr.io). Roda a cada push na main e
# também pode ser disparado manualmente na aba "Actions".

on:
  push:
    branches: [main]
    paths:
      - "webapp/**"
      - ".github/workflows/build-webapp.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # necessário para publicar no ghcr.io

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      # Habilita build multi-arquitetura (constrói ARM64 em runner x86).
      - name: Configurar QEMU
        uses: docker/setup-qemu-action@v3

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Converte o nome do repositório para minúsculas (exigência do ghcr).
      - name: Definir nome da imagem
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-webapp" >> "$GITHUB_OUTPUT"

      - name: Build e push (ARM64)
        uses: docker/build-push-action@v6
        with:
          context: ./webapp
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
